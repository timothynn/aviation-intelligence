version: 1
purpose: "Global first-party aviation source registry for document-intelligence acquisition"
policy:
  repository_binary: false
  currentness: "revalidate at ingestion"
  source_priority: "current authoritative source > current regulator guidance > national implementation > historical/reference"
  note: "This registry covers source families and public acquisition points. Dynamic regulator libraries should be crawled at ingestion rather than frozen in Git."

sources:
