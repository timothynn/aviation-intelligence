version: 1
purpose: "Public-source corpus for aviation document intelligence testing"
notes:
  - "URLs are first-party authority sources discovered during the 2026-08-23 corpus scan."
  - "The downloader records and fetches sources locally; it does not commit arbitrary third-party/copyrighted binaries into Git."
  - "Currentness must be revalidated at ingestion time because authority pages can change."
  - "Swiss FOCA/BAZL makes illustration copies of ICAO Annexes and selected PANS documents available from its official site. FOCA states these publications are illustrative and may not be complete/current, and that ICAO commercial subscriptions remain the authoritative publication channel."

