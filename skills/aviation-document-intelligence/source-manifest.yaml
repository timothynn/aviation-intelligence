    version: "Mixed editions/amendments as published by FOCA"
    type: icao_annex_library
    source_page: https://www.bazl.admin.ch/en/annexes-to-the-convention-on-international-civil-aviation-icao
    asset_types: [pdf]
    link_match: "^ICAO Annex (?:[1-9]|1[0-9])\\b"
    download_all: true
    local_test: true
    repo_binary: false
    policy: source_reference
    publisher_disclaimer: "FOCA states that the publication serves for illustration, assumes no liability for correctness or completeness, and points users to ICAO for commercial printouts/digital subscriptions."

