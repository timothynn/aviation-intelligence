[project]
name = "aviation-document-intelligence"
version = "0.1.0"
description = "Reference ingestion and source-management tooling for aviation document intelligence"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
]

[project.scripts]
avdoc-download = "scripts.download_corpus:main"
