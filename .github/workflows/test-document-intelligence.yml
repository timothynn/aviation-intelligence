name: Test Aviation Document Intelligence

on:
  pull_request:
    paths:
      - 'packages/aviation-document-intelligence/**'
      - '.github/workflows/test-document-intelligence.yml'
  workflow_dispatch:

concurrency:
  group: document-intelligence-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-document-intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aviation-document-intelligence
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/aviation-document-intelligence/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e .

      - name: Verify package import
        run: python -c "import aviation_docint; print(aviation_docint.__version__)"

      - name: Run tests
        run: python -m pytest -q
