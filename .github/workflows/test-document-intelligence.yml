name: Test Aviation Document Intelligence

on:
  push:
    paths:
      - 'packages/aviation-document-intelligence/**'
      - '.github/workflows/test-document-intelligence.yml'
  pull_request:
    paths:
      - 'packages/aviation-document-intelligence/**'
      - '.github/workflows/test-document-intelligence.yml'

jobs:
  test-document-intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aviation-document-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
