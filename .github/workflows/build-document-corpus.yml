name: Build Aviation Document Corpus

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated source IDs from the aviation document manifest; blank = all'
        required: false
        default: ''
  schedule:
    - cron: '0 3 1 * *'

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 pyyaml

      - name: Download official-source corpus
        env:
          SOURCE_IDS: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          mkdir -p data/corpus
          if [ -z "${SOURCE_IDS:-}" ]; then
            python skills/aviation-document-intelligence/scripts/download_corpus.py
          else
            IFS=',' read -ra IDS <<< "$SOURCE_IDS"
            ARGS=()
            for id in "${IDS[@]}"; do ARGS+=(--only "$id"); done
            python skills/aviation-document-intelligence/scripts/download_corpus.py "${ARGS[@]}"
          fi

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: aviation-document-corpus
          path: data/corpus/
          retention-days: 14
