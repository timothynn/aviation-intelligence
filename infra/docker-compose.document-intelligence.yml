services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aviation_intelligence
      POSTGRES_USER: aviation
      POSTGRES_PASSWORD: aviation_dev_only
    ports:
      - "5433:5432"
    volumes:
      - aviation_postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviation -d aviation_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  aviation_postgres:
